name: Pack CLS 0.3.5 Binary Packages (LXDE, Sway, Firefox, Flatpak, Tmux)
on: [workflow_dispatch]
permissions:
  contents: write

jobs:
  pack-all:
    runs-on: ubuntu-latest
    steps:
      - name: Download static xbps-install
        run: |
          sudo apt-get update && sudo apt-get install -y curl zstd xz-utils
          H="repo-default.voidlinux.org"
          curl -fL "https://$H/static/xbps-static-latest.x86_64-musl.tar.xz" -o xbps.tar.xz
          mkdir -p xbps_bin && tar -xf xbps.tar.xz -C xbps_bin

      - name: Fetch full dependency trees (glibc + musl) and pack .clp
        run: |
          mkdir -p out work
          XBPS="$PWD/xbps_bin/usr/bin/xbps-install.static"
          H="repo-default.voidlinux.org"

          pack_group() {
            local NAME="$1"
            shift
            echo "=== Packing $NAME.clp ==="
            mkdir -p "work/$NAME/$NAME/data" "work/$NAME/$NAME/gnubuild" "work/$NAME/$NAME/muslbuild"

            # GNU/glibc
            mkdir -p "work/$NAME/gnu_root/var/db/xbps/keys"
            cp xbps_bin/var/db/xbps/keys/* "work/$NAME/gnu_root/var/db/xbps/keys/"
            XBPS_ARCH=x86_64 "$XBPS" -S -y -r "work/$NAME/gnu_root" -R "https://$H/current" "$@"
            cp -a "work/$NAME/gnu_root/"* "work/$NAME/$NAME/gnubuild/"
            rm -rf "work/$NAME/$NAME/gnubuild/var/db/xbps" "work/$NAME/$NAME/gnubuild/var/cache/xbps"

            # musl
            mkdir -p "work/$NAME/musl_root/var/db/xbps/keys"
            cp xbps_bin/var/db/xbps/keys/* "work/$NAME/musl_root/var/db/xbps/keys/"
            XBPS_ARCH=x86_64-musl "$XBPS" -S -y -r "work/$NAME/musl_root" -R "https://$H/current/musl" "$@"
            cp -a "work/$NAME/musl_root/"* "work/$NAME/$NAME/muslbuild/"
            rm -rf "work/$NAME/$NAME/muslbuild/var/db/xbps" "work/$NAME/$NAME/muslbuild/var/cache/xbps"

            printf '[package]\nname="%s"\nver="0.3.5"\narch=["x86_64"]\n[flavors]\ngnu=true\nmusl=true\n' "$NAME" > "work/$NAME/$NAME/data/data.toml"
            tar -C "work/$NAME" -cf - "$NAME" | xz -T0 -6 > "out/$NAME.clp"
            rm -rf "work/$NAME"
          }

          pack_group "tmux" tmux
          pack_group "flatpak" flatpak xdg-desktop-portal-gtk
          pack_group "firefox" firefox
          pack_group "sway" sway seatd foot fuzzel grim slurp mesa-dri
          pack_group "lxde" lxde xorg-minimal xf86-video-amdgpu xf86-video-intel xf86-input-libinput dejavu-fonts-ttf wpa_supplicant dhcpcd

      - name: Upload all .clp packages to repo-x86_64
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repo-x86_64
          files: out/*.clp
