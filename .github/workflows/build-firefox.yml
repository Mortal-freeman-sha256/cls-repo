name: Build CLS 0.3.5 Firefox ESR
on: [workflow_dispatch]
permissions:
  contents: write

jobs:
  build-firefox:
    runs-on: ubuntu-latest
    steps:
      - name: Install build deps & compile Firefox ESR
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential clang llvm lld rustc cargo cbindgen nodejs npm yasm nasm libgtk-3-dev libdbus-glib-1-dev libxt-dev libpulse-dev libasound2-dev libx11-xcb-dev libdrm-dev libgbm-dev libwayland-dev curl xz-utils zstd
          MH="archive.mozilla.org/pub/firefox/releases/140.0esr/source"
          curl -fL "https://$MH/firefox-140.0esr.source.tar.xz" -o ff.tar.xz || curl -fL "https://mozilla.org" -o ff.tar.xz
          tar -xf ff.tar.xz && cd firefox-*
          sed -i 's/arg\.s/arg.value/g' python/mach/mach/command_util.py 2>/dev/null || true
          printf 'ac_add_options --prefix=/usr\nac_add_options --enable-application=browser\nac_add_options --enable-release\nac_add_options --disable-debug\nac_add_options --disable-tests\nac_add_options --disable-crashreporter\nac_add_options --disable-updater\nac_add_options --enable-default-toolkit=cairo-gtk3-wayland\nac_add_options --without-wasm-sandboxed-libraries\n' > mozconfig
          ./mach build && DESTDIR=$PWD/../ff_dest ./mach install && cd ..
          mkdir -p pkg/firefox/data pkg/firefox/gnubuild out && cp -a ff_dest/* pkg/firefox/gnubuild/
          find pkg/firefox -type f \( -name "*.so*" -o -perm -111 \) -exec strip --strip-unneeded {} + 2>/dev/null || true
          printf '[package]\nname="firefox"\nver="0.3.5"\narch=["x86_64"]\n[flavors]\ngnu=true\n' > pkg/firefox/data/data.toml
          tar -C pkg -cJf out/firefox.clp firefox
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: repo-x86_64
          files: out/firefox.clp
